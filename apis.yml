aid: general-intelligence
name: General Intelligence
description: >-
  The General Intelligence Company of New York builds Cofounder, an AI agent
  orchestration platform that lets a founder run an entire business through a
  coordinating network of specialized agents. Cofounder breaks a company into
  repeatable Flows and deploys agents across engineering, design, marketing,
  sales, finance, and support - handling product code, brand assets, outbound
  campaigns, incorporation, and customer service with human-approval checkpoints
  before significant actions execute. It provisions managed GitHub, Vercel, and
  Supabase, connects Stripe, Linear, Postmark, and Composio-powered MCP toolkits,
  and coordinates departments over shared company context. The company raised an
  $8.7M seed led by Union Square Ventures. Cofounder is a product workspace, not
  a public developer API - it consumes external APIs and MCP servers rather than
  publishing its own REST surface.
